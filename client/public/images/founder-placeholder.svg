<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" fill="url(#bg)" rx="24" />

  <!-- Subtle Graph Paper Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="480" />
    <line x1="80" y1="0" x2="80" y2="480" />
    <line x1="120" y1="0" x2="120" y2="480" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="240" y1="0" x2="240" y2="480" />
    <line x1="280" y1="0" x2="280" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="360" y1="0" x2="360" y2="480" />
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="280" x2="400" y2="280" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="0" y1="360" x2="400" y2="360" />
    <line x1="0" y1="400" x2="400" y2="400" />
    <line x1="0" y1="440" x2="400" y2="440" />
  </g>

  <!-- Founder Portrait Silhouette & Tech Iconography -->
  <g transform="translate(100, 90)">
    <!-- Aura Glow Ring -->
    <circle cx="100" cy="95" r="85" fill="none" stroke="url(#glow)" stroke-width="2" stroke-dasharray="8 6" stroke-opacity="0.6" />
    
    <!-- Head -->
    <circle cx="100" cy="70" r="42" fill="#4338ca" opacity="0.85" />
    <!-- Body -->
    <path d="M40 180 C40 135, 70 125, 100 125 C130 125, 160 135, 160 180 Z" fill="#3730a3" opacity="0.9" />

    <!-- Glasses / Engineer Accent -->
    <circle cx="86" cy="68" r="9" fill="none" stroke="#f97316" stroke-width="2" />
    <circle cx="114" cy="68" r="9" fill="none" stroke="#f97316" stroke-width="2" />
    <line x1="95" y1="68" x2="105" y2="68" stroke="#f97316" stroke-width="2" />

    <!-- Terminal Code Tag -->
    <rect x="25" y="195" width="150" height="28" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="100" y="214" fill="#a5b4fc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">&lt;Eng. Abdelrahman /&gt;</text>
  </g>

  <!-- Decorative Corner Accents -->
  <text x="20" y="40" fill="#818cf8" font-family="monospace" font-size="14" opacity="0.4">{ founder }</text>
  <text x="340" y="460" fill="#fb923c" font-family="monospace" font-size="14" opacity="0.4">★ codek</text>
</svg>
