<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeK | كودك</title>
    
    <!-- Google Fonts: Inter (UI Latin), IBM Plex Sans Arabic (Arabic + fallback Latin), JetBrains Mono (code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Square+Peg&display=swap" rel="stylesheet">
    
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('academy_ui_preferences');
          var theme = 'system';
          var accent = 'default';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state) {
              theme = parsed.state.theme || 'system';
              accent = parsed.state.accent || 'default';
            }
          } else {
            theme = localStorage.getItem('academy_theme') || 'system';
            accent = localStorage.getItem('academy_accent') || 'default';
          }
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-accent', accent);
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-brand-500 selection:text-white transition-colors duration-200 min-h-screen">
    <div id="root" class="min-h-screen"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
